name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # The oldest Ubuntu Koharu supports, since a binary needs the glibc
          # it was linked against or a newer one.
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'ubuntu-24.04-arm'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-app-${{ matrix.platform }}
          save-if: true

      - name: Install macOS CEF helper targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install --no-install-recommends \
            libgtk-4-dev \
            build-essential \
            llvm \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ matrix.platform }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Cache tauri-cli
        id: tauri_cli_cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: v2-${{ matrix.platform }}-tauri-cli-17a527316d3aee46f7185c178d3b3122d8ebfd7b

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ steps.tauri_cli_cache.outputs.cache-hit }}" = "true" ]; then
            bun install --frozen-lockfile --ignore-scripts
          else
            bun install --frozen-lockfile
          fi
          cargo tauri --version

      - name: Generate release changelog
        id: release_notes
        shell: bash
        run: |
          git fetch https://github.com/koharu-rs/koharu.git refs/tags/0.83.5:refs/tags/0.83.5 --no-tags || true
          {
            echo 'release_body<<RELEASE_NOTES_EOF'
            bun git-cliff --offline --current --strip all
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
